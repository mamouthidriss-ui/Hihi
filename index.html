<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swap Studio</title>
<style>
:root{--bg:#e8e6ff;--ink:#17123a;--pink:#ff3d7f;--sun:#ffd84d;--card:#fff;--mut:#5b5680}
@media(prefers-color-scheme:dark){:root{--bg:#17123a;--ink:#f1efff;--card:#241d52;--mut:#a9a3d6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Trebuchet MS",system-ui,sans-serif;padding:20px 16px 60px}
main{max-width:760px;margin:0 auto}
h1{font-size:clamp(40px,9vw,76px);line-height:.95;margin:8px 0 10px;font-weight:900;letter-spacing:-.03em}
h1 span{background:var(--pink);color:#fff;padding:0 .15em;border-radius:.12em;display:inline-block;transform:rotate(-2deg)}
.lead{color:var(--mut);max-width:46ch;margin:0 0 22px}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{position:relative;aspect-ratio:1;background:var(--card);border:3px dashed var(--ink);border-radius:22px;display:grid;place-items:center;text-align:center;cursor:pointer;overflow:hidden;font-weight:700;padding:10px}
.drop:focus-within,.drop.over{border-style:solid;background:var(--sun);color:#17123a}
.drop small{display:block;font-weight:400;color:var(--mut)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop video,.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop.full{border-style:solid}
.consent{display:flex;gap:10px;margin:18px 0;font-size:14px;color:var(--mut)}
.consent input{width:22px;height:22px;accent-color:var(--pink);flex:none;margin-top:2px}
button.go{width:100%;border:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:20px;font-family:inherit;padding:18px;border-radius:18px;cursor:pointer;transition:transform .1s}
button.go:active{transform:scale(.98)}button.go:disabled{opacity:.35;cursor:not-allowed}
button.go:focus-visible,.pl:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
#err{color:var(--pink);font-weight:700;min-height:1.5em;margin:10px 0 0}
#prog{display:none;margin-top:22px}
.bar{height:16px;background:var(--card);border-radius:99px;overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink) 0 12px,#ff7aa8 12px 24px);transition:width .4s}
#msg{font-weight:700;margin-top:8px}
#res{display:none;margin-top:26px}
.cmp{position:relative;border-radius:22px;overflow:hidden;background:#000;border:3px solid var(--ink);touch-action:none}
.cmp video{display:block;width:100%}
.cmp .top{position:absolute;inset:0;height:100%;object-fit:contain;clip-path:inset(0 50% 0 0)}
.cmp .line{position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:var(--sun);pointer-events:none}
.tag{position:absolute;top:10px;padding:3px 10px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.pl,.dl{border:3px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:16px;font-family:inherit;padding:10px 18px;border-radius:14px;cursor:pointer;text-decoration:none}
.dl{background:var(--sun);color:#17123a}
#sl{flex:1;min-width:140px;accent-color:var(--pink)}
.note{font-size:13px;color:var(--mut);margin-top:26px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>Un visage.<br><span>Une autre vidéo.</span></h1>
<p class="lead">Dépose ta vidéo et ton avatar. On remplace le visage et on garde le son.</p>
<div class="drops">
 <label class="drop" id="dv"><div>Vidéo<small>MP4, MOV · 30 s max</small></div><input type="file" id="fv" accept="video/*"></label>
 <label class="drop" id="da"><div>Avatar<small>JPG, PNG · visage de face</small></div><input type="file" id="fa" accept="image/*"></label>
</div>
<label class="consent"><input type="checkbox" id="ck">
 <span>Je confirme avoir l'accord des personnes dont le visage ou la voix apparaît, et j'accepte la mention « Généré par IA » sur la vidéo.</span></label>
<button class="go" id="go" disabled>Changer le visage</button>
<p id="err" role="alert"></p>
<section id="prog"><div class="bar"><i id="fill"></i></div><div id="msg"></div></section>
<section id="res">
 <div class="cmp" id="cmp">
  <video id="vb" playsinline loop></video><video id="va" class="top" playsinline loop muted></video>
  <span class="tag" style="left:10px">Après</span><span class="tag" style="right:10px">Avant</span>
  <div class="line" id="ln"></div></div>
 <div class="row"><button class="pl" id="pl">Lecture</button>
  <input type="range" id="sl" min="0" max="100" value="50" aria-label="Comparer avant et après">
  <a class="dl" id="dl" download="resultat.mp4">Télécharger</a></div>
</section>
<p class="note">Mode démo : le résultat est une simulation. Branche FaceFusion (ENGINE=facefusion) pour un vrai remplacement de visage.</p>
</main>
<script>
const $=i=>document.getElementById(i);let files={};
function pick(id,box,kind){$(id).onchange=e=>{const f=e.target.files[0];if(!f)return;files[kind]=f;
 const u=URL.createObjectURL(f),el=document.createElement(kind=='v'?'video':'img');el.src=u;if(kind=='v'){el.muted=true;el.autoplay=true;el.loop=true;el.playsInline=true}
 $(box).querySelectorAll('video,img').forEach(x=>x.remove());$(box).append(el);$(box).classList.add('full');check()}}
pick('fv','dv','v');pick('fa','da','a');
['dv','da'].forEach(b=>{const e=$(b);['dragover','dragenter'].forEach(t=>e.addEventListener(t,()=>e.classList.add('over')));
 ['dragleave','drop'].forEach(t=>e.addEventListener(t,()=>e.classList.remove('over')))});
function check(){$('go').disabled=!(files.v&&files.a&&$('ck').checked)}$('ck').onchange=check;
$('go').onclick=async()=>{$('err').textContent='';$('go').disabled=true;$('res').style.display='none';
 const fd=new FormData();fd.append('video',files.v);fd.append('avatar',files.a);fd.append('consent','1');
 $('prog').style.display='block';$('fill').style.width='3%';$('msg').textContent='Envoi en cours…';
 try{const r=await fetch('/api/jobs',{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw j.error;poll(j.id)}
 catch(e){fail(e)}};
function fail(e){$('err').textContent=typeof e=='string'?e:'Échec. Vérifie tes fichiers et réessaie.';$('prog').style.display='none';check()}
async function poll(id){const j=await(await fetch('/api/jobs/'+id)).json();
 if(j.status=='error')return fail('Le traitement a échoué : '+(j.error||''));
 $('fill').style.width=Math.max(5,j.progress*100)+'%';
 $('msg').textContent=j.status=='queued'?`En attente (position ${j.position})…`:j.status=='done'?'Terminé':'Remplacement du visage…';
 if(j.status!='done')return setTimeout(()=>poll(id),1000);show(id)}
function show(id){$('prog').style.display='none';$('res').style.display='block';
 $('vb').src=`/files/${id}/result.mp4`;$('va').src=`/files/${id}/orig.mp4`;$('dl').href=$('vb').src;
 $('vb').play();$('va').play();$('pl').textContent='Pause';check();$('res').scrollIntoView({behavior:'smooth'})}
$('pl').onclick=()=>{const p=$('vb').paused;[$('vb'),$('va')].forEach(v=>p?v.play():v.pause());$('pl').textContent=p?'Pause':'Lecture'};
$('vb').ontimeupdate=()=>{if(Math.abs($('va').currentTime-$('vb').currentTime)>.15)$('va').currentTime=$('vb').currentTime};
function cut(v){$('va').style.clipPath=`inset(0 0 0 ${v}%)`;$('ln').style.left=v+'%'}
$('sl').oninput=e=>cut(e.target.value);
$('cmp').onpointermove=e=>{if(e.buttons){const r=$('cmp').getBoundingClientRect(),v=Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100));$('sl').value=v;cut(v)}};
cut(50);
</script></body></html>
